services:
  mysql:
    image: mysql:8.4
    container_name: kadoo_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kadoo
      MYSQL_USER: kadoo
      MYSQL_PASSWORD: kadoo_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: America/Fortaleza
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
